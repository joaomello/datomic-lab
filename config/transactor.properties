# Datomic Pro transactor config — local dev with Prometheus metrics
#
# Usage: bin/transactor config/transactor.properties
# Docs:  https://docs.datomic.com/operation/monitoring.html

protocol=dev
host=localhost
port=4334

# Memory settings for dev laptops (-Xmx1g).
# For production (-Xmx4g): memory-index-max=512m, object-cache-max=1g
memory-index-threshold=32m
memory-index-max=256m
object-cache-max=128m

# Register the metrics-exporter callback (built from ./metrics-exporter in
# this repo). The JAR must be on the transactor classpath — place it in
# ./lib/ of your Datomic installation.
# Metrics are exposed at http://localhost:9100/metrics (Prometheus format).
metrics-callback=lab.datomic-metrics/metrics
