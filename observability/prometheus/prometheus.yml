global:
  scrape_interval: 30s
  evaluation_interval: 30s

scrape_configs:
  - job_name: datomic-transactor
    static_configs:
      - targets:
          - host.containers.internal:9100
    metrics_path: /metrics

  - job_name: datomic-peer
    static_configs:
      - targets:
          - host.containers.internal:9101
    metrics_path: /metrics
